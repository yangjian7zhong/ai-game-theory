<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI博弈论 · 囚徒困境</title>
<style>
:root{--bg:#0a0a1a;--card:#12122a;--border:#2a2a5a;--gold:#ffd700;--red:#ff4757;--blue:#3742fa;--green:#2ed573;--purple:#a855f7;--cyan:#06d6a0;--text:#e8e8f0;--muted:#6b7280}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 5px rgba(255,215,0,.2)}50%{box-shadow:0 0 20px rgba(255,215,0,.5)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes danger{0%,100%{box-shadow:0 0 5px rgba(255,71,87,.2)}50%{box-shadow:0 0 25px rgba(255,71,87,.6)}}

.hdr{background:linear-gradient(135deg,#0f0f2e,#1a1a3a);border-bottom:2px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.hdr-left{display:flex;align-items:center;gap:12px}
.hdr h1{font-size:20px;font-weight:900;background:linear-gradient(135deg,var(--gold),#ffaa00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge{border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;color:#fff;letter-spacing:1px}
.badge-phase{background:linear-gradient(135deg,var(--blue),var(--purple))}
.wrap{display:flex;height:calc(100vh - 56px)}

/* Main */
.main{flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-template:repeat(4,1fr);grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px;text-align:center}
.stat .label{font-size:10px;color:var(--muted);margin-bottom:2px}
.stat .value{font-size:18px;font-weight:900;color:var(--gold);font-family:monospace}
.phase-banner{text-align:center;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:15px;font-weight:700;letter-spacing:2px;animation:fadeIn .5s;transition:all .5s}
.phase-dialogue{background:linear-gradient(135deg,rgba(55,66,250,.12),rgba(10,10,42,.6));border-color:var(--blue);color:var(--blue)}
.phase-trial{background:linear-gradient(135deg,rgba(255,71,87,.12),rgba(42,10,10,.6));border-color:var(--red);color:var(--red)}
.phase-result{background:linear-gradient(135deg,rgba(255,215,0,.1),rgba(42,30,10,.6));border-color:var(--gold);color:var(--gold)}
.phase-idle{background:rgba(255,255,255,.03);border-color:var(--border);color:var(--muted)}

/* Player Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px}
.card{background:linear-gradient(180deg,var(--card),#0a0a1a);border:1.5px solid var(--border);border-radius:12px;padding:10px;transition:all .3s;position:relative}
.card:hover{border-color:var(--gold);transform:translateY(-1px)}
.card.dead{opacity:.2;filter:grayscale(1);transform:none}
.card.dead:hover{transform:none}
.card.voting{animation:danger 1.5s infinite}
.card .top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex-shrink:0;border:2px solid rgba(255,255,255,.1)}
.card .name{font-weight:800;font-size:12px;line-height:1.2}
.card .role-tag{font-size:9px;padding:1px 5px;border-radius:4px;font-weight:700;display:inline-block;margin-top:1px}
.card .collar{position:absolute;top:8px;right:10px;display:flex;align-items:center;gap:4px}
.collar-dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.2)}
.card .chat-chance{font-size:10px;color:var(--muted);margin-top:3px}
.card .chat-chance span{color:var(--gold);font-weight:700}
.card .vote-badge{position:absolute;bottom:6px;right:6px;font-size:11px;padding:2px 6px;border-radius:6px;background:rgba(255,71,87,.15);color:var(--red);border:1px solid rgba(255,71,87,.3);font-weight:700}
.card .last-msg{font-size:9px;color:var(--muted);margin-top:3px;font-style:italic;line-height:1.3;max-height:28px;overflow:hidden}

/* Log */
.log-panel{width:360px;background:var(--card);border-left:2px solid var(--border);display:flex;flex-direction:column}
.log-header{padding:10px 14px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px;color:var(--gold);display:flex;justify-content:space-between;align-items:center}
.log-body{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:2px}
.log-entry{padding:4px 8px;border-radius:5px;font-size:11px;line-height:1.4;border-left:3px solid transparent;animation:slideIn .3s}
.log-system{background:rgba(255,215,0,.05);border-left-color:var(--gold);color:var(--gold)}
.log-private{background:rgba(55,66,250,.06);border-left-color:var(--blue)}
.log-public{background:rgba(168,85,247,.06);border-left-color:var(--purple);font-weight:700}
.log-trial{background:rgba(255,71,87,.08);border-left-color:var(--red);color:var(--red);font-weight:700}
.log-result{background:rgba(46,213,115,.06);border-left-color:var(--green)}
.log-collar{background:rgba(6,214,160,.05);border-left-color:var(--cyan);color:var(--cyan)}
.log-controls{padding:8px;border-top:1px solid var(--border);display:flex;gap:4px;flex-wrap:wrap}
.btn{flex:1;min-width:44px;padding:7px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;text-align:center}
.btn:hover:not(:disabled){border-color:var(--gold);background:rgba(255,215,0,.1)}
.btn:disabled{opacity:.25;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--purple));border-color:var(--blue);color:#fff;letter-spacing:1px}
.btn-danger{background:linear-gradient(135deg,var(--red),#c0392b);border-color:var(--red);color:#fff}
.btn-danger:hover:not(:disabled){box-shadow:0 0 15px rgba(255,71,87,.4)}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.intro-card{max-width:680px;width:95%;max-height:90vh;overflow-y:auto;background:linear-gradient(180deg,#1a1a3a,#0a0a1a);border:1.5px solid var(--border);border-radius:16px;padding:22px;animation:fadeIn .5s}
.intro-card h2{text-align:center;font-size:20px;background:linear-gradient(135deg,var(--gold),#ffaa00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:14px}
.rule-section{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:8px}
.rule-section h3{padding:6px 12px;background:linear-gradient(135deg,rgba(55,66,250,.2),rgba(168,85,247,.2));color:var(--gold);font-size:12px}
.rule-row{display:flex;justify-content:space-between;padding:5px 12px;border-bottom:1px solid rgba(42,42,90,.3);font-size:11px}
.rule-row:last-child{border-bottom:none}
.rule-row .rl{color:var(--muted)}.rule-row .rv{color:var(--text);font-weight:700}
.big-btn{display:block;width:100%;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border:2px solid var(--gold);padding:12px;font-size:16px;font-weight:900;border-radius:12px;cursor:pointer;letter-spacing:4px;margin-top:12px;transition:all .3s}
.big-btn:hover{box-shadow:0 0 25px rgba(55,66,250,.5);transform:translateY(-2px)}

.result-card{max-width:480px;width:95%;text-align:center;background:linear-gradient(180deg,#1a1a3a,#0a0a1a);border:2px solid var(--gold);border-radius:16px;padding:22px;animation:fadeIn .5s}
.result-card h2{font-size:18px;margin-bottom:10px}
.rank-list{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:10px 0;text-align:left}
.rank-item{display:flex;justify-content:space-between;padding:6px 12px;border-bottom:1px solid rgba(42,42,90,.3);font-size:12px;align-items:center}
.rank-item:first-child{background:rgba(255,215,0,.08)}
.rank-name{flex:1;font-weight:700}
.rank-role{font-size:10px;padding:2px 6px;border-radius:4px;margin-left:6px}
.restart-btn{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border:2px solid rgba(255,255,255,.2);padding:8px 24px;font-size:13px;font-weight:700;border-radius:10px;cursor:pointer;margin-top:10px;transition:all .3s}
.restart-btn:hover{transform:translateY(-2px);box-shadow:0 0 15px rgba(55,66,250,.5)}

.collar-legend{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.collar-legend-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
.collar-legend-dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.2)}

::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
@media(max-width:768px){.wrap{flex-direction:column}.log-panel{width:100%;height:35vh}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div class="hdr">
<div class="hdr-left">
<h1>⚡ AI博弈论 · 囚徒困境</h1>
<span class="badge badge-phase" id="PHBADGE">等待</span>
</div>
<div style="font-size:11px;color:var(--muted)">7人局 · 裁判观战</div>
</div>

<div class="wrap">
<div class="main">
<div class="stats">
<div class="stat"><div class="label">轮次</div><div class="value" id="SBR">-</div></div>
<div class="stat"><div class="label">存活</div><div class="value" id="SBA">7</div></div>
<div class="stat"><div class="label">对话余量</div><div class="value" id="SBC">-</div></div>
<div class="stat"><div class="label">审判</div><div class="value" id="SBT" style="font-size:14px">未发动</div></div>
</div>
<div class="phase-banner phase-idle" id="BAN">点击开始游戏</div>
<div class="grid" id="PGD"></div>
</div>

<div class="log-panel">
<div class="log-header"><span>📋 实时日志</span><span id="LGC" style="font-size:10px;color:var(--muted)">0</span></div>
<div class="log-body" id="LBX"></div>
<div class="log-controls">
<button class="btn btn-primary" id="BS" onclick="startGame()">⚡ 开始</button>
<button class="btn" id="BSP" onclick="spdChg(1)" disabled>⏩</button>
<button class="btn" id="BSL" onclick="spdChg(-1)" disabled>⏪</button>
<button class="btn" id="BPT" onclick="doPause()" disabled>⏸</button>
<button class="btn" onclick="doReset()">🔄</button>
</div>
</div>
</div>

<!-- Intro -->
<div id="IOVL" class="overlay">
<div class="intro-card">
<h2>⚡ AI博弈论 · 囚徒困境</h2>
<div class="rule-section">
<h3>🎭 身份配置</h3>
<div class="rule-row"><span class="rl">人数</span><span class="rv">7人，其中1人是内鬼</span></div>
<div class="rule-row"><span class="rl">项圈</span><span class="rv">每人佩戴彩色项圈</span></div>
<div class="rule-row"><span class="rl">普通人</span><span class="rv">能看到别人的项圈颜色，<b>看不到自己的</b></span></div>
<div class="rule-row"><span class="rl">内鬼</span><span class="rv">能看到<b>所有人</b>的项圈颜色（含自己的）</span></div>
</div>
<div class="rule-section">
<h3>💬 对话系统</h3>
<div class="rule-row"><span class="rl">每轮机会</span><span class="rv">每人2次对话机会</span></div>
<div class="rule-row"><span class="rl">私聊</span><span class="rv">消耗1次，仅目标可见</span></div>
<div class="rule-row"><span class="rl">公开喊话</span><span class="rv">消耗2次，所有人可见</span></div>
</div>
<div class="rule-section">
<h3>♥ 红心审判</h3>
<div class="rule-row"><span class="rl">发动</span><span class="rv">每轮只能发动1次，失败不计次数</span></div>
<div class="rule-row"><span class="rl">投票</span><span class="rv">需要半数及以上通过</span></div>
<div class="rule-row"><span class="rl">猜对</span><span class="rv">内鬼被揪出，好人阵营胜利！</span></div>
<div class="rule-row"><span class="rl">猜错</span><span class="rv"><b style="color:var(--red)">参与投票的人全部死亡</b></span></div>
</div>
<div class="collar-legend" id="CLEG"></div>
<button class="big-btn" onclick="startGame()">⚡ 开始游戏</button>
</div>
</div>

<!-- Result -->
<div id="ROVL" class="overlay" style="display:none;z-index:110">
<div class="result-card">
<h2 id="RTTL">游戏结束</h2>
<div class="rank-list" id="FRK"></div>
<div id="TRV" style="color:var(--muted);font-size:11px;margin:8px 0"></div>
<button class="restart-btn" onclick="doReset()">🔄 重新开始</button>
</div>
</div>

<script>
// ============ DATA ============
const NAMES=['谋略家·曹操','义士·关羽','智者·诸葛亮','武圣·吕布','隐士·司马懿','医者·华佗','猛将·赵云'];
const SHORT=['曹','关','诸','吕','司','华','赵'];
const COLORS=['#ff4757','#ffd700','#3742fa','#2ed573','#a855f7','#ff6b81','#06d6a0'];
const COLLAR_COLORS=['#ff4757','#ffd700','#3742fa','#2ed573','#a855f7','#ff6b81','#06d6a0'];
const COLLAR_NAMES=['红','金','蓝','绿','紫','粉','青'];
const PERSONALITY=['深谋远虑','热血义气','冷静观察','勇猛果敢','诡计多端','和平主义','均衡发展'];

// ============ STATE ============
let Players=[], roundNum=0, phase='idle', running=false, paused=false, speed=1, gameOver=false;
let tm=null, pf=null, logCount=0, insiderIdx=-1;
let SPD_MS=[1200,700,300,80];
let trialUsed=false, totalDialogue=0;

// ============ PLAYER ============
function makePlayer(i){
  return{idx:i,name:NAMES[i],color:COLORS[i],personality:PERSONALITY[i],
    alive:true,chatChances:2,isInsider:false,
    collarColor:COLLAR_COLORS[i],collarName:COLLAR_NAMES[i],
    lastMsg:'',targetOf:[],votedBy:[]};
}
function initPlayers(){Players=[];for(let i=0;i<7;i++)Players.push(makePlayer(i));}
function shuffle(a){for(let k=a.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function alive(){return Players.filter(p=>p.alive);}
function short(p){return p.name.split('·')[1]||p.name;}
function aliveCount(){return alive().length;}

// ============ LOG ============
const LBX=document.getElementById('LBX');
function log(msg,type){
  type=type||'log-system';let d=document.createElement('div');
  d.className='log-entry '+type;d.textContent=msg;
  LBX.appendChild(d);LBX.scrollTop=LBX.scrollHeight;
  logCount++;document.getElementById('LGC').textContent=logCount;
}

// ============ RENDERING ============
function renderCards(){
  let g=document.getElementById('PGD');g.innerHTML='';
  for(let p of Players){
    let d=document.createElement('div');
    let cls='card';if(!p.alive)cls+=' dead';
    if(phase==='trial'&&!p.alive)cls+=' dead';
    d.className=cls;

    // Collar display: spectator sees all colors, but in game logic ordinary players can't see their own
    let collarHtml='<div class="collar"><div class="collar-dot" style="background:'+p.collarColor+'"></div><span style="font-size:9px;color:'+p.collarColor+'">'+p.collarName+'</span></div>';

    // Role tag
    let roleTag='';
    if(gameOver){
      roleTag='<div class="role-tag" style="background:'+(p.isInsider?'rgba(255,71,87,.15)':'rgba(46,213,115,.15)')+';color:'+(p.isInsider?'var(--red)':'var(--green)')+';border:1px solid '+(p.isInsider?'rgba(255,71,87,.3)':'rgba(46,213,115,.3)')+'">'+(p.isInsider?'🎭 内鬼':'✅ 好人')+'</div>';
    }

    // Chat chances
    let chatHtml=p.alive?'<div class="chat-chance">对话余量: <span>'+p.chatChances+'</span>/2</div>':'';

    // Last message
    let msgHtml=p.lastMsg?'<div class="last-msg">"'+p.lastMsg+'"</div>':'';

    d.innerHTML='<div class="top"><div class="avatar" style="background:'+p.color+'22;border-color:'+p.color+'">'+SHORT[p.idx]+'</div><div style="flex:1"><div class="name" style="color:'+p.color+'">'+p.name+'</div>'+roleTag+'</div>'+collarHtml+'</div>'+chatHtml+msgHtml;
    g.appendChild(d);
  }
}

function updateBar(){
  let al=aliveCount();
  document.getElementById('SBR').textContent=roundNum>0?roundNum:'-';
  document.getElementById('SBA').textContent=al;
  let totalChats=alive().reduce((s,p)=>s+p.chatChances,0);
  document.getElementById('SBC').textContent=totalChats;
  document.getElementById('SBT').textContent=trialUsed?'已发动':'未发动';

  let pb=document.getElementById('BAN');
  let badge=document.getElementById('PHBADGE');
  let phaseNames={'idle':'等待','dialogue':'对话阶段','trial':'红心审判','result':'结算','over':'结束'};

  if(gameOver){
    pb.innerHTML='🏆 游戏结束';pb.className='phase-banner phase-result';
    badge.textContent='结束';
  } else if(phase==='dialogue'){
    pb.innerHTML='💬 第'+roundNum+'轮 · 对话阶段';pb.className='phase-banner phase-dialogue';
    badge.textContent='💬 对话';badge.className='badge badge-phase';
  } else if(phase==='trial'){
    pb.innerHTML='♥ 第'+roundNum+'轮 · 红心审判';pb.className='phase-banner phase-trial';
    badge.textContent='♥ 审判';badge.className='badge badge-phase';
    badge.style.background='linear-gradient(135deg,var(--red),#c0392b)';
  } else if(running){
    pb.innerHTML='⏳ '+phaseNames[phase];pb.className='phase-banner phase-idle';
  } else if(roundNum>0){
    pb.innerHTML='⏳ 上一轮已结束';pb.className='phase-banner phase-idle';
  } else {
    pb.innerHTML='⚡ 点击开始游戏';pb.className='phase-banner phase-idle';
  }
}

function wait(){return new Promise(r=>{if(paused){pf=r}else{tm=setTimeout(r,SPD_MS[speed]);}});}
function resume(){if(pf){let f=pf;pf=null;f();}}

// ============ AI DIALOGUE ============
function genPrivateMsg(sender,target){
  let s=sender,t=target;
  if(s.isInsider){
    // Insider tries to deflect suspicion, subtly mislead
    let msgs=[
      '我觉得'+short(pick(alive().filter(p=>p.idx!==s.idx&&p.idx!==t.idx)))+'的项圈颜色有点奇怪',
      '你有没有注意到谁的行为不太对？',
      '我信任你，我们互保吧',
      '我看到一些线索，但还不确定',
      '先别急着下结论，再观察一轮'
    ];
    // If target is also insider (impossible in 7p1i but just in case)
    return pick(msgs);
  }
  // Good player
  let msgs=[
    '你能看到我的项圈颜色吗？我看不到自己的',
    '我怀疑有人在伪装，你觉得是谁？',
    '你觉得谁最可疑？',
    '我的项圈是什么颜色？告诉我',
    '我们需要更多信息，你有什么线索？',
    '我觉得' + short(pick(alive().filter(p=>p.idx!==s.idx&&p.idx!==t.idx))) + '不太对劲',
    '你能帮我确认一下我的项圈颜色吗？',
    '下一轮我们合作吧'
  ];
  return pick(msgs);
}

function genPublicMsg(sender){
  let s=sender;
  if(s.isInsider){
    let msgs=[
      '我觉得大家应该多分享信息',
      '不要互相猜疑，冷静分析',
      '有人在故意混淆视听',
      '我看到一些可疑的行为',
      '我们应该团结起来找出内鬼'
    ];
    return pick(msgs);
  }
  let msgs=[
    '我是好人，我愿意分享信息',
      '有人敢公开自己的项圈颜色吗？',
      '我觉得应该多交流',
      '大家有没有什么线索？',
      '我们需要更多信息才能判断',
      '我不确定谁是内鬼，但我觉得有人在说谎',
      '希望好人能赢'
  ];
  return pick(msgs);
}

// ============ GAME LOGIC ============
async function startGame(){
  document.getElementById('IOVL').style.display='none';
  initPlayers();
  roundNum=0;running=true;paused=false;gameOver=false;
  logCount=0;totalDialogue=0;
  LBX.innerHTML='';

  // Assign insider
  insiderIdx=Math.floor(Math.random()*7);
  Players[insiderIdx].isInsider=true;

  document.getElementById('BSP').disabled=false;
  document.getElementById('BSL').disabled=false;
  document.getElementById('BPT').disabled=false;
  document.getElementById('BS').disabled=true;

  log('⚡ AI博弈论 · 囚徒困境 启动!','log-system');
  log('7人中隐藏1名内鬼，找出他就能赢!','log-system');
  log('【裁判视角】内鬼: '+Players[insiderIdx].name,'log-system');

  // Show collar assignments
  for(let p of Players){
    log('项圈分配: '+SHORT[p.idx]+' '+short(p)+' → '+p.collarName+'色项圈','log-collar');
  }

  renderCards();updateBar();
  await gameLoop();
}

async function gameLoop(){
  while(running&&!gameOver){
    roundNum++;
    trialUsed=false;

    // Reset chat chances
    for(let p of alive())p.chatChances=2;
    for(let p of Players){p.lastMsg='';p.targetOf=[];}

    log('═══════════════════════════','log-system');
    log('第'+roundNum+'轮开始 · 存活'+aliveCount()+'人','log-system');

    // Show collar info to each player
    for(let p of alive()){
      let others=alive().filter(t=>t.idx!==p.idx);
      let info=others.map(t=>short(t)+'='+t.collarName).join(' ');
      if(p.isInsider){
        log('🔍 '+short(p)+'[内鬼] 看到所有项圈: '+info+' 自己='+p.collarName,'log-collar');
      } else {
        log('👁 '+short(p)+' 看到的项圈: '+info+' (看不到自己的)','log-collar');
      }
    }

    // Phase 1: Dialogue
    await dialoguePhase();

    // Check win after dialogue (if someone figures it out via info)
    if(checkWin())break;

    // Phase 2: Red Heart Trial
    await trialPhase();

    if(checkWin())break;

    // Check if game should continue
    if(aliveCount()<=1){
      endGame('insider');
      break;
    }

    await wait();
  }
}

async function dialoguePhase(){
  phase='dialogue';updateBar();renderCards();
  log('💬 进入对话阶段 · 每人2次机会','log-system');

  let al=shuffle([...alive()]);
  totalDialogue=0;

  for(let p of al){
    if(!running||gameOver)return;

    // AI decides how to use chat chances
    while(p.chatChances>0&&p.alive){
      if(!running||gameOver)return;

      // Decide: private or public?
      let usePublic=p.chatChances>=2&&Math.random()<0.3;
      let usePrivate=p.chatChances>=1&&!usePublic;

      if(usePublic&&p.chatChances>=2){
        // Public shout
        p.chatChances-=2;
        let msg=genPublicMsg(p);
        p.lastMsg=msg;
        log('📢 '+SHORT[p.idx]+' '+short(p)+'[公开]: '+msg,'log-public');
        totalDialogue++;
        await wait();renderCards();
        break; // public uses all remaining chances this turn
      } else if(usePrivate&&p.chatChances>=1){
        // Private chat
        p.chatChances-=1;
        let targets=alive().filter(t=>t.idx!==p.idx);
        if(targets.length===0)break;
        let target=pick(targets);
        let msg=genPrivateMsg(p,target);
        p.lastMsg='[私聊→'+short(target)+'] '+msg;
        target.targetOf.push({from:short(p),msg:msg});
        log('🔒 '+SHORT[p.idx]+' '+short(p)+' → '+SHORT[target.idx]+' '+short(target)+'[私聊]: '+msg,'log-private');
        totalDialogue++;
        await wait();renderCards();
      } else {
        break;
      }
    }
  }

  log('对话阶段结束 · 共'+totalDialogue+'次对话','log-system');
}

async function trialPhase(){
  phase='trial';updateBar();renderCards();

  let al=alive();
  if(al.length<=2){
    log('存活人数不足，无法发动红心审判','log-system');
    return;
  }

  // AI decides whether to call for trial
  let caller=null;
  let shuffled=shuffle([...al]);

  for(let p of shuffled){
    if(!running||gameOver)return;
    if(p.isInsider){
      // Insider rarely calls trial unless they think they can manipulate
      if(Math.random()<0.15&&al.length<=4){
        caller=p;break;
      }
    } else {
      // Good player: more likely to call if they have strong suspicion
      let suspicion=0;
      if(p.personality==='深谋远虑'||p.personality==='冷静观察')suspicion+=0.3;
      if(al.length<=4)suspicion+=0.2;
      if(roundNum>=3)suspicion+=0.15;
      if(Math.random()<suspicion){
        caller=p;break;
      }
    }
  }

  if(!caller){
    log('无人发动红心审判，本轮结束','log-system');
    phase='result';return;
  }

  log('♥♥♥ '+SHORT[caller.idx]+' '+short(pick(al))+' 发动红心审判!','log-trial');

  // Voting phase
  let votes={};
  let voteTargets={};
  let voters=[];

  for(let p of al){
    if(!running||gameOver)return;
    await wait();

    // AI votes: try to identify the insider
    let target=null;
    if(p.isInsider){
      // Insider votes for a good player to deflect
      let goodTargets=alive().filter(t=>!t.isInsider);
      target=goodTargets.length>0?pick(goodTargets):pick(alive().filter(t=>t.idx!==p.idx));
    } else {
      // Good player: vote based on suspicion
      // Use collar info + dialogue to make decision
      let suspects=alive().filter(t=>t.idx!==p.idx);
      // Simple heuristic: random with bias
      target=pick(suspects);
    }

    if(target){
      votes[target.idx]=(votes[target.idx]||0)+1;
      voteTargets[target.idx]=target;
      voters.push(p);
      log('🗳 '+SHORT[p.idx]+' '+short(p)+' 投票: '+short(target),'log-trial');
      renderCards();
    }
  }

  // Count votes
  let maxVotes=0,winnerIdx=-1,tie=false;
  for(let idx in votes){
    if(votes[idx]>maxVotes){maxVotes=votes[idx];winnerIdx=parseInt(idx);tie=false;}
    else if(votes[idx]===maxVotes)tie=true;
  }

  let majority=Math.ceil(al.length/2);

  if(tie||maxVotes===0){
    log('投票平局或无人投票，审判失败','log-trial');
    log('审判失败，不计入次数','log-system');
    phase='result';return;
  }

  if(maxVotes<majority){
    log('票数不足半数('+maxVotes+'/'+al.length+')，审判失败','log-trial');
    log('审判失败，不计入次数','log-system');
    phase='result';return;
  }

  // Trial passes! Check if the voted target is the insider
  let target=voteTargets[winnerIdx];
  if(target&&target.isInsider){
    // CORRECT! Good wins!
    log('🎉🎉🎉 猜对了！'+short(target)+' 就是内鬼!','log-result');
    log('好人阵营胜利!','log-result');
    endGame('good');
  } else {
    // WRONG! All voters die
    log('💀💀💀 猜错了！'+short(target)+' 不是内鬼!','log-trial');
    log('参与投票的人全部死亡!','log-trial');
    for(let v of voters){
      if(v.alive){
        v.alive=false;
        log('☠️ '+short(v)+' 死亡','log-trial');
      }
    }
    renderCards();await wait();

    // Check win after deaths
    if(checkWin())return;

    // If insider is among dead voters, check
    if(target)target.alive=false; // the wrongly accused also dies? No, in the rules "参与投票的全死" means voters die
    // Actually re-reading: "猜错参与投票的全死" - only voters die, the accused survives
    // Let me fix: the accused should NOT die
    if(target&&!target.isInsider){target.alive=true;} // restore

    phase='result';
  }
}

function checkWin(){
  let al=alive();
  let insiders=al.filter(p=>p.isInsider);
  let goods=al.filter(p=>!p.isInsider);

  if(insiders.length===0){
    endGame('good');return true;
  }
  if(insiders.length>=goods.length){
    endGame('insider');return true;
  }
  if(al.length<=1){
    endGame(al[0].isInsider?'insider':'good');return true;
  }
  return false;
}

function endGame(winner){
  gameOver=true;running=false;phase='over';
  document.getElementById('BSP').disabled=true;
  document.getElementById('BSL').disabled=true;
  document.getElementById('BPT').disabled=true;

  let title=document.getElementById('RTTL');
  if(winner==='good'){
    title.textContent='🎉 好人阵营胜利!';
    title.style.color='var(--green)';
    log('═══════════════════════════','log-result');
    log('🎉🎉🎉 好人阵营胜利! 内鬼被揪出!','log-result');
  } else {
    title.textContent='🐺 内鬼获胜!';
    title.style.color='var(--red)';
    log('═══════════════════════════','log-trial');
    log('💀 内鬼获胜! 好人阵营失败!','log-trial');
  }

  // Reveal all roles
  let fr=document.getElementById('FRK');fr.innerHTML='';
  for(let p of Players){
    let status=p.alive?'✅ 存活':'💀 死亡';
    let roleColor=p.isInsider?'var(--red)':'var(--green)';
    let roleName=p.isInsider?'内鬼':'好人';
    fr.innerHTML+='<div class="rank-item"><span class="rank-name" style="color:'+p.color+'">'+SHORT[p.idx]+' '+p.name+'</span><span class="rank-role" style="background:'+(p.isInsider?'rgba(255,71,87,.15)':'rgba(46,213,115,.15)')+';color:'+roleColor+';border:1px solid '+(p.isInsider?'rgba(255,71,87,.3)':'rgba(46,213,115,.3)')+'">'+roleName+'</span><span style="font-size:10px;margin-left:6px;color:'+(p.alive?'var(--green)':'var(--red)')+'">'+status+'</span></div>';
  }

  let info='内鬼: '+Players[insiderIdx].name+' ('+Players[insiderIdx].collarName+'色项圈)<br>';
  info+='共进行 '+roundNum+' 轮 · '+totalDialogue+' 次对话';
  document.getElementById('TRV').innerHTML=info;
  document.getElementById('ROVL').style.display='flex';
  renderCards();updateBar();
}

// ============ CONTROLS ============
function spdChg(d){speed=Math.max(0,Math.min(3,speed+d));}
function doPause(){paused=!paused;document.getElementById('BPT').textContent=paused?'▶':'⏸';if(!paused)resume();}
function doReset(){
  running=false;gameOver=false;paused=false;roundNum=0;phase='idle';
  if(tm){clearTimeout(tm);tm=null;}pf=null;
  document.getElementById('ROVL').style.display='none';
  document.getElementById('IOVL').style.display='flex';
  LBX.innerHTML='';logCount=0;
  document.getElementById('BSP').disabled=true;
  document.getElementById('BSL').disabled=true;
  document.getElementById('BPT').disabled=true;
  document.getElementById('BS').disabled=false;
  document.getElementById('BPT').textContent='⏸';
  initPlayers();renderCards();updateBar();
}

// ============ INIT ============
window.onload=function(){
  initPlayers();renderCards();updateBar();
  // Build collar legend
  let leg=document.getElementById('CLEG');
  for(let i=0;i<7;i++){
    leg.innerHTML+='<div class="collar-legend-item"><div class="collar-legend-dot" style="background:'+COLLAR_COLORS[i]+'"></div>'+COLLAR_NAMES[i]+'色</div>';
  }
};
